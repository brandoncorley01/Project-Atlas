# Render Blueprint — Project Atlas API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: atlas-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_SCAN_SCOPE
        value: priority
      - key: ODDS_MAX_SPORTS_PER_SCAN
        value: "2"
      - key: ODDS_CACHE_TTL_MINUTES
        value: "10080"
      - key: ODDS_INCLUDE_FUTURES_ON_LIVE
        value: "false"
      - key: ODDS_SPEND_MODE
        value: cache_only
      - key: ODDS_MIN_CREDITS_RESERVE
        value: "500"
      - key: ODDS_INSIGHT_PROP_EVENTS
        value: "0"
      - key: ODDS_INSIGHT_MIN_CREDITS_RESERVE
        value: "500"
      - key: ODDS_SEARCH_PROP_EVENTS
        value: "0"
      - key: ODDS_SEARCH_MIN_CREDITS_RESERVE
        value: "500"
      - key: ATLAS_EXPERT_INTELLIGENCE_ENABLED
        value: "true"
      - key: ATLAS_MARKET_INTELLIGENCE_ENABLED
        value: "true"
      - key: ATLAS_OPTIONS_FLOW_PROVIDER
        value: "fixture"
      - key: ATLAS_OPTIONS_FLOW_ALLOW_SIMULATED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false

  # Learning flywheel — auto-track, grade outcomes, coach rollup, AI intelligence.
  # Runs every 6 hours UTC (2am/8am/2pm/8pm Eastern during standard time).
  - type: cron
    name: atlas-learning-cron
    runtime: python
    rootDir: apps/api
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.nightly_learning
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_SCAN_SCOPE
        value: priority
      - key: ODDS_MAX_SPORTS_PER_SCAN
        value: "2"
      - key: ODDS_CACHE_TTL_MINUTES
        value: "10080"
      - key: ODDS_INCLUDE_FUTURES_ON_LIVE
        value: "false"
      - key: ODDS_SPEND_MODE
        value: cache_only
      - key: ODDS_MIN_CREDITS_RESERVE
        value: "500"
      - key: ODDS_INSIGHT_PROP_EVENTS
        value: "0"
      - key: ODDS_INSIGHT_MIN_CREDITS_RESERVE
        value: "500"
      - key: ODDS_SEARCH_PROP_EVENTS
        value: "0"
      - key: ODDS_SEARCH_MIN_CREDITS_RESERVE
        value: "500"
      - key: ATLAS_EXPERT_INTELLIGENCE_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
